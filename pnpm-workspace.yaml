# Supply-chain guard: a package version must be at least 1 day old before pnpm installs it.
# Do not disable. Add a temporary `minimumReleaseAgeExclude` entry only for an urgent fix
# from a trusted publisher, and remove it once the window passes.
minimumReleaseAge: 1440

packages:
  - apps/*
  - packages/*

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^22.18.0
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  lucide-react: ^0.545.0
  react: ^19.2.0
  react-dom: ^19.2.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - esbuild

overrides:
  # drizzle-kit pulls an older, vulnerable esbuild through esm-loader
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
