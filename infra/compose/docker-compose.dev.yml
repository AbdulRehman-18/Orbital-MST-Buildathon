# Local dependencies for development: `pnpm infra:up`.
# The local EVM chain (31337) runs from packages/contracts (`hardhat node`) starting in Phase 2.
name: namma-seva-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nammaseva
      POSTGRES_USER: ns_user
      POSTGRES_PASSWORD: change_me
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ns_user -d nammaseva"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
