# Alertmanager: Slack for everything, email for critical. Secrets are mounted as files
# (infra/secrets/*, git-ignored) rather than templated into this file.
global:
  resolve_timeout: 5m
  smtp_smarthost: smtp.example.org:587           # TODO: set to the ULB / platform SMTP relay
  smtp_from: alerts@nammaseva.example.org
  smtp_auth_username: alerts@nammaseva.example.org
  smtp_auth_password_file: /run/secrets/smtp_password
  smtp_require_tls: true

route:
  receiver: slack
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: slack-and-email
      repeat_interval: 1h

receivers:
  - name: slack
    slack_configs:
      - api_url_file: /run/secrets/slack_webhook_url
        channel: "#namma-seva-alerts"
        send_resolved: true
        title: "{{ .CommonLabels.severity | toUpper }}: {{ .CommonAnnotations.summary }}"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\nRunbook: {{ .Annotations.runbook }}\n{{ end }}"
  - name: slack-and-email
    slack_configs:
      - api_url_file: /run/secrets/slack_webhook_url
        channel: "#namma-seva-alerts"
        send_resolved: true
        title: "CRITICAL: {{ .CommonAnnotations.summary }}"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\nRunbook: {{ .Annotations.runbook }}\n{{ end }}"
    email_configs:
      - to: oncall@nammaseva.example.org         # TODO: on-call distribution list
        send_resolved: true
