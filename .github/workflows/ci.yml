# Continuous integration (plan §18.2): install → typecheck → contracts (+coverage, opcode guard) →
# static analysis → API tests → web tests + build → e2e/a11y against the demo stack.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  check:
    name: Typecheck & i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # There is no ESLint config: strict TypeScript across every package is the lint gate.
      - run: pnpm run typecheck
      - run: pnpm run i18n:check

  contracts:
    name: Contracts (tests, coverage, opcode guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Compile + Shanghai opcode guard (ADR 0003)
        run: pnpm --filter @namma-seva/contracts build
      - name: Unit, fuzz and governance tests
        run: pnpm --filter @namma-seva/contracts test
      - name: Coverage
        run: pnpm --filter @namma-seva/contracts coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contracts-coverage
          path: packages/contracts/coverage
          if-no-files-found: ignore

  slither:
    name: Slither (fails on Medium+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @namma-seva/contracts slither

  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Postgres is PGlite (real Postgres in WASM, in-process): same SQL and migrations as production
      # without a container. The container path is exercised by the `stack` job below.
      - run: pnpm test:api

  web:
    name: Web tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @namma-seva/web test
      - run: pnpm --filter @namma-seva/web build
        env:
          VITE_NS_CHAIN: mstTestnet
      - name: Bundle budget — first-load JS + CSS ≤ 450 kB gzip (map and role dashboards are lazy)
        run: |
          total=0
          for f in apps/web/dist/assets/{index,react,vendor,web3}-*.js apps/web/dist/assets/index-*.css; do
            total=$((total + $(gzip -c "$f" | wc -c)))
          done
          echo "first-load bundle: ${total} bytes gzip (budget 460800)"
          test "$total" -le 460800

  e2e:
    name: E2E & accessibility (Hardhat demo stack)
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @namma-seva/web exec playwright install --with-deps chromium
      - name: Start the demo stack (Hardhat chain → deploy → PGlite → seed → indexer → API → web)
        run: |
          pnpm demo > demo.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fs http://localhost:3001/api/ready >/dev/null && curl -fs http://localhost:5173/ >/dev/null && exit 0
            sleep 2
          done
          echo "demo stack did not become ready"; tail -n 80 demo.log; exit 1
      - run: pnpm --filter @namma-seva/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            demo.log
          if-no-files-found: ignore

  lighthouse:
    name: "Lighthouse (mobile — perf ≥ 85, a11y ≥ 95)"
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @namma-seva/web build
        env: { VITE_NS_CHAIN: mstTestnet }
      # Audits the production bundle. Pages that need data render their loading/empty states here
      # (no API in this job); the demo-stack e2e job covers populated pages for accessibility.
      - run: npx -y @lhci/cli@0.14.x autorun --config=lighthouserc.json

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: API / indexer image
        uses: docker/build-push-action@v6
        with: { context: ., file: infra/docker/Dockerfile.api, push: false, tags: namma-seva-api:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Web image
        uses: docker/build-push-action@v6
        with: { context: ., file: infra/docker/Dockerfile.web, push: false, load: true, tags: namma-seva-web:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Nginx config is valid and ships the CSP
        run: |
          docker run --rm --add-host api:127.0.0.1 -e NS_SERVER_NAME=ci.test namma-seva-web:ci sh -c \
            '/docker-entrypoint.d/20-envsubst-on-templates.sh >/dev/null && nginx -t && grep -q "Content-Security-Policy" /etc/nginx/conf.d/default.conf'
