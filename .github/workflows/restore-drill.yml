# Weekly restore drill (plan §18.3): fetch the newest nightly backup from object storage, restore it
# into a throw-away Postgres and sanity-check it. A failing drill is an incident: the backup is not
# proven until it has been restored.
name: Backup restore drill

on:
  schedule:
    - cron: "30 2 * * 0" # Sundays 08:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    environment: prod # AWS_* secrets + BACKUP_S3_URI live here
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the newest backup
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
        run: |
          mkdir -p backups
          newest=$(aws s3 ls "${{ vars.BACKUP_S3_URI }}/" | grep '\.dump$' | sort | tail -1 | awk '{print $4}')
          test -n "$newest" || { echo "::error::no backup found"; exit 1; }
          aws s3 cp "${{ vars.BACKUP_S3_URI }}/$newest" backups/
          aws s3 cp "${{ vars.BACKUP_S3_URI }}/$newest.sha256" backups/ || true
      - name: Restore and verify
        run: sh infra/scripts/restore-test.sh | tee restore-summary.json
      - uses: actions/upload-artifact@v4
        with: { name: restore-drill, path: restore-summary.json }
