# On every push to main: build both images, push to GHCR, and roll the `dev` environment (MST testnet).
name: Deploy (dev)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: namma-seva-api (also runs as namma-seva-indexer)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/namma-seva-api:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/namma-seva-api:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: namma-seva-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          build-args: |
            VITE_NS_CHAIN=mstTestnet
            VITE_NS_EXPLORER_URL=https://testnet.mstscan.com
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/namma-seva-web:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/namma-seva-web:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: dev # holds DEV_SSH_HOST, DEV_SSH_USER, DEV_SSH_KEY and the URL shown on the deployment
    steps:
      - uses: actions/checkout@v4
      - name: Roll the stack (migrate → api → indexer → web)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/namma-seva
            export REGISTRY=${{ env.REGISTRY }}/${{ env.OWNER }} TAG=${{ needs.images.outputs.tag }}
            docker compose -f infra/compose/docker-compose.prod.yml --env-file infra/compose/prod.env pull
            docker compose -f infra/compose/docker-compose.prod.yml --env-file infra/compose/prod.env up -d --remove-orphans
            # Fail the deploy (and keep the previous containers' logs) if readiness never turns green.
            for i in $(seq 1 30); do curl -fs http://127.0.0.1:${WEB_PORT:-8080}/api/ready && exit 0; sleep 4; done
            docker compose -f infra/compose/docker-compose.prod.yml logs --tail 80 api indexer; exit 1
